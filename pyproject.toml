[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaic-kinder-info"
version = "1.11.0"
description = "유치원알리미 공공데이터 기반 유치원 검색·비교 도구"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kaicot" }]
dependencies = []

[project.scripts]
kinderinfo = "kinderinfo:main"

[tool.setuptools]
py-modules = [
  "kaic_kinder_core",
  "kinderbulk",
  "kinderinfo",
  "kinderweb",
  "neis",
  "route",
  "schoolbus",
  "schoolinfo",
  "traffic_safety",
  "verified_hours",
]
